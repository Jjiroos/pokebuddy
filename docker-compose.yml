services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokebuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokebuddy}
      POSTGRES_DB: ${POSTGRES_DB:-pokebuddy}
    ports:
      # 5432 est souvent déjà pris par un PostgreSQL local. Le port hôte est
      # donc réglable ; dans le réseau compose, l'API joint toujours db:5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Volume nommé, jamais un bind mount : les données Postgres ne doivent
      # pas atterrir sur le système de fichiers de l'hôte.
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokebuddy} -d ${POSTGRES_DB:-pokebuddy}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      # inotify ne traverse pas certains montages (réseau, WSL) : sans polling
      # le rechargement à chaud est silencieusement mort.
      WATCHFILES_FORCE_POLLING: "true"
      # Dans le conteneur les caches vivent dans un volume nommé : hors du
      # système de fichiers de l'hôte, et survivant aux rebuilds.
      LLM_CACHE_PATH: /cache/llm.sqlite
      POKEAPI_CACHE_DIR: /cache/pokeapi
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - appcache:/cache
    command: >
      uvicorn src.api.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/src

volumes:
  pgdata:
  appcache:
