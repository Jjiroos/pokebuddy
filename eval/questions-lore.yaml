- id: lore-feunard-queues
  category: lore
  question: "Que dit le Pokédex des neuf queues de Feunard, et combien de temps peut-il vivre ?"
  expected: "Ses neuf queues détiennent un pouvoir mystique ; il peut vivre mille ans"
  source: "pokeapi:pokemon-species/38 flavor_text_entries[fr][black]"
  check:
    kind: names
    all_of: [[mystique, mystiques], [mille ans, 1000 ans, "1 000 ans"]]

- id: lore-mewtwo-origine
  category: lore
  question: "Comment le Pokédex explique-t-il l'origine de Mewtwo ?"
  expected: "Conçu en réorganisant les gènes de Mew, par manipulation génétique"
  source: "pokeapi:pokemon-species/150 flavor_text_entries[fr][black]"
  check:
    kind: names
    all_of: [[genes, gene, adn], [mew]]
    # « Mewtwo » contient « mew » ; la recherche du grader se fait sur des mots
    # encadrés d'espaces, donc « mewtwo » ne valide pas l'alias « mew ».

