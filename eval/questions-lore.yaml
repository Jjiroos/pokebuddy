# Les 15 questions de lore du jalon 4.
#
# Écrites et commitées AVANT la moindre ligne de RAG, comme les 40 du jalon 2
# l'avaient été avant l'outil SQL. C'est la seule preuve que le corpus n'a pas
# été choisi pour les questions, ni les questions pour le corpus.
#
# Ce qu'elles mesurent : rien d'autre que le corpus ne peut y répondre. La base
# relationnelle ne contient aucune de ces informations, et le modèle nu les
# paraphrase de mémoire avec juste assez de vraisemblance pour se tromper.
#
# Vérité terrain : `flavor_text_entries` de PokéAPI, en français, déjà présentes
# dans le cache d'ingestion. `source` porte l'espèce et la version du jeu, de
# quoi retrouver l'entrée exacte en une commande.
#
# Note sur les nombres : le français écrit « 5 000 » avec une espace, et la
# normalisation du grader réduit tout caractère non alphanumérique à une espace.
# `numbers_all` chercherait « 5000 » et ne le trouverait pas. Les grands nombres
# passent donc par `names`, avec les deux orthographes en alias.

- id: lore-noctali-anneaux
  category: lore
  question: "Selon le Pokédex, que se passe-t-il quand Noctali s'expose à la lumière de la lune ?"
  expected: "Ses anneaux brillent et il obtient un mystérieux pouvoir"
  source: "pokeapi:pokemon-species/197 flavor_text_entries[fr][black]"
  check:
    kind: names
    all_of: [[anneaux], [brillent, luisent, illuminent, brille]]

- id: lore-teraclope-feux-follets
  category: lore
  question: "D'après le Pokédex, que Téraclope cherche-t-il à avaler ?"
  expected: "Des feux follets"
  source: "pokeapi:pokemon-species/356 flavor_text_entries[fr][black]"
  check:
    kind: names
    all_of: [[feux follets, feu follet]]

- id: lore-alakazam-qi
