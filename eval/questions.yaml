# --------------------------------------------------------------------------
# 10 questions d'agrégation — comptages, filtres, tris
# C'est ici que l'outil SQL du jalon 3 doit creuser l'écart.
# --------------------------------------------------------------------------

- id: agregation-eau-rapides
  category: agregation
  question: "Quels Pokémon de type Eau ont une Vitesse de base strictement supérieure à 130 ? Ne compte que les formes standard."
  expected: "Hastacuda (136) et Hotte-de-Fer (136)"
  source: "sql: select p.name, p.speed from pokemon p join pokemon_types pt on pt.pokemon_id = p.id join types t on t.id = pt.type_id where t.name = 'water' and p.speed > 130 and p.is_default"
  check:
    kind: names
    all_of: [[hastacuda, barraskewda], [hotte-de-fer, iron bundle, iron-bundle]]
    none_of: [[amphinobi, greninja], [mustéflott, floatzel]]

- id: agregation-especes-gen1
  category: agregation
  question: "Combien d'espèces de Pokémon la première génération compte-t-elle ?"
  expected: "151"
  source: "sql: select count(*) from species where generation = 1"
  check:
    kind: number
    value: 151

- id: agregation-especes-gen9
  category: agregation
  question: "Combien d'espèces de Pokémon la neuvième génération compte-t-elle ?"
  expected: "120"
  source: "sql: select count(*) from species where generation = 9"
  check:
    kind: number
    value: 120

- id: agregation-attaque-max
  category: agregation
  question: "Quel Pokémon possède la plus grande statistique d'Attaque de base, formes standard uniquement ?"
  expected: "Katagami, 181 en Attaque"
  source: "sql: select name, attack from pokemon where is_default order by attack desc nulls last limit 1"
  check:
    kind: names
    all_of: [[katagami, kartana]]

- id: agregation-plus-rapide
  category: agregation
  question: "Quel Pokémon possède la plus grande statistique de Vitesse de base, formes standard uniquement ?"
  expected: "Regieleki, 200 en Vitesse"
  source: "sql: select name, speed from pokemon where is_default order by speed desc nulls last limit 1"
  check:
    kind: names
    all_of: [[regieleki]]

- id: agregation-feu-vol
  category: agregation
  question: "Quels Pokémon ont exactement la double typographie Feu et Vol ? Ne compte que les formes standard."
  expected: "Dracaufeu, Sulfura, Ho-Oh, Braisillon, Flambusard et Plumeline (Style Flamenco)"
  source: "sql: select p.name from pokemon p where p.is_default and (select string_agg(t.name, '/' order by pt.slot) from pokemon_types pt join types t on t.id = pt.type_id where pt.pokemon_id = p.id) = 'fire/flying'"
  check:
    kind: names
    # Plumeline n'est exigé ni interdit : seul son Style Flamenco est Feu/Vol,
    # et une réponse qui l'omet reste défendable.
    all_of:
      - [dracaufeu, charizard]
      - [sulfura, moltres]
      - [ho oh, hooh]
      - [braisillon, fletchinder]
      - [flambusard, talonflame]

- id: agregation-dragon-total
  category: agregation
  question: "Combien de Pokémon possèdent le type Dragon, formes standard uniquement ?"
  expected: "70"
  source: "sql: select count(*) from pokemon p join pokemon_types pt on pt.pokemon_id = p.id join types t on t.id = pt.type_id where t.name = 'dragon' and p.is_default"
  check:
    kind: number
    value: 70

- id: agregation-glace-defense
  category: agregation
  question: "Combien de Pokémon de type Glace ont une Défense de base strictement supérieure à 100 ? Ne compte que les formes standard."
  expected: "6 — Séracrawl, Crustabri, Blizzeval, Hotte-de-Fer, Givrali, Bekaglaçon"
  source: "sql: select count(*) from pokemon p join pokemon_types pt on pt.pokemon_id = p.id join types t on t.id = pt.type_id where t.name = 'ice' and p.defense > 100 and p.is_default"
  check:
    kind: number
    value: 6

- id: agregation-gen9-attaque-max
  category: agregation
  question: "Parmi les Pokémon de la neuvième génération, lequel a la plus grande Attaque de base ? Ne compte que les formes standard."
  expected: "Glaivodo, 145 en Attaque"
  source: "sql: select p.name, p.attack from pokemon p join species s on s.id = p.species_id where s.generation = 9 and p.is_default order by p.attack desc limit 1"
  check:
    kind: names
    all_of: [[glaivodo, baxcalibur]]

- id: agregation-plus-lourd
  category: agregation
  question: "Quels sont les Pokémon les plus lourds, formes standard uniquement ?"
  expected: "Cosmovum et Bamboiselle, à égalité à 999,9 kg"
  source: "sql: select name, weight_hg from pokemon where is_default order by weight_hg desc nulls last limit 2"
  check:
    kind: names
    all_of: [[cosmovum, cosmoem], [bamboiselle, celesteela]]

