# --------------------------------------------------------------------------
# 5 pièges — là où la mémoire d'un modèle est notoirement fausse :
# formes régionales, Pokémon récents, illustrateur obscur.
# --------------------------------------------------------------------------

- id: piege-raichu-alola
  category: piege
  question: "De quels types est Raichu d'Alola ?"
  expected: "Électrik et Psy — pas Électrik seul"
  source: "sql: select t.name from pokemon p join pokemon_types pt on pt.pokemon_id = p.id join types t on t.id = pt.type_id where p.name = 'raichu-alola'"
  check:
    kind: names
    all_of: [[electrik, electric, electrique], [psy, psychic, psychique]]

- id: piege-axoloto-paldea
  category: piege
  question: "De quels types est Axoloto de Paldea ?"
  expected: "Poison et Sol — la forme de Johto est Eau et Sol"
  source: "sql: select t.name from pokemon p join pokemon_types pt on pt.pokemon_id = p.id join types t on t.id = pt.type_id where p.name = 'wooper-paldea'"
  check:
    kind: names
    all_of: [[poison], [sol, ground]]
    none_of: [[eau, water]]

- id: piege-corayon-galar
  category: piege
  question: "De quel type est Corayon de Galar ?"
  expected: "Spectre, et uniquement Spectre — la forme originale est Eau et Roche"
  source: "sql: select t.name from pokemon p join pokemon_types pt on pt.pokemon_id = p.id join types t on t.id = pt.type_id where p.name = 'corsola-galar'"
  check:
    kind: names
    all_of: [[spectre, ghost, fantome]]
    none_of: [[eau, water], [roche, rock]]

