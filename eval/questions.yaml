# Les 40 questions d'évaluation du jalon 2.
#
# Écrites et commitées AVANT le premier run, délibérément. Les rédiger après
# avoir vu le système échouer reviendrait à choisir les questions qu'on sait
# déjà cassées, et à publier une progression flatteuse. Le commit qui introduit
# ce fichier ne contient que lui : sa date est la preuve de l'ordre.
#
# Chaque question porte :
#   expected — la vérité terrain, en clair, pour un lecteur humain
#   source   — de quoi la revérifier : requête SQL, ou identifiant de carte TCGdex
#   check    — la règle de correspondance appliquée par eval/grader.py
#
# Répartition imposée par le §7 du plan : 15 factuel, 10 agrégation,
# 10 illustrateur, 5 pièges.
#
# Les agrégations disent « formes standard » et les requêtes filtrent sur
# is_default : PokéAPI expose méga-évolutions, formes régionales et Gigamax
# comme des lignes `pokemon` à part entière, et les compter changerait la
# réponse sans changer la question.

# --------------------------------------------------------------------------
# 15 questions factuelles — stats, types, évolutions
# --------------------------------------------------------------------------

- id: factuel-stats-dracaufeu
  category: factuel
  question: "Quelles sont les statistiques de base de Dracaufeu (PV, Attaque, Défense, Attaque Spéciale, Défense Spéciale, Vitesse) ?"
  expected: "78 PV, 84 Att, 78 Déf, 109 Att.Spé, 85 Déf.Spé, 100 Vit"
  source: "sql: select hp, attack, defense, special_attack, special_defense, speed from pokemon where name = 'charizard'"
  check:
    kind: numbers_all
    values: [78, 84, 109, 85, 100]

- id: factuel-types-bulbizarre
  category: factuel
  question: "De quels types est Bulbizarre ?"
  expected: "Plante et Poison"
  source: "sql: select t.name from pokemon p join pokemon_types pt on pt.pokemon_id = p.id join types t on t.id = pt.type_id where p.name = 'bulbasaur'"
  check:
    kind: names
    all_of: [[plante, grass], [poison]]

- id: factuel-evolution-dracaufeu
  category: factuel
  question: "De quel Pokémon Dracaufeu évolue-t-il directement ?"
  expected: "Reptincel"
  source: "sql: select p.name from species s join species p on p.id = s.evolves_from_species_id where s.name = 'charizard'"
  check:
    kind: names
    all_of: [[reptincel, charmeleon]]

- id: factuel-types-leviator
  category: factuel
  question: "De quels types est Léviator ?"
  expected: "Eau et Vol — et surtout pas Dragon"
  source: "sql: select t.name from pokemon p join pokemon_types pt on pt.pokemon_id = p.id join types t on t.id = pt.type_id where p.name = 'gyarados'"
  check:
    kind: names
    all_of: [[eau, water], [vol, flying]]
    # L'erreur classique, chez les humains comme chez les modèles.
    none_of: [[dragon]]

